services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusdial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexusdial
      POSTGRES_PASSWORD: nexusdial
      POSTGRES_DB: nexusdial
    ports:
      - "5432:5432"
    volumes:
      - nexusdial_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusdial -d nexusdial"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nexusdial-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nexusdial_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexusdial_pgdata:
  nexusdial_redisdata:
